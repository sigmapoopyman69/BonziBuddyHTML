<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonzi Buddy World</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #a370cc; /* Classic Bonzi purple background */
            font-family: "MS Sans Serif", Geneva, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            text-align: center;
        }

        /* Retro Activation Button */
        #start-btn {
            background: #d4d0c8;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            color: #000;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
        }

        #start-btn:active {
            border-top: 2px solid #404040;
            border-left: 2px solid #404040;
            border-right: 2px solid #fff;
            border-bottom: 2px solid #fff;
        }

        p {
            max-width: 400px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>Bonzi Buddy Bouncer</h1>
    <p>Click the button below to start. Ensure you click <b>"Always Allow Popups"</b> in your browser address bar!</p>
    <button id="start-btn" onclick="initializeBonziSystem()">ACTIVATE BONZI</button>

    <script>
        // Array of your exact uploaded image filenames
        const imagePool = [
            'IMG_3879-210x280.jpeg',
            'geometry-dash-grief.gif',
            'pasted-image-1792970376308_b50ae186-598f-44c2-8402-41e0d044af46.png',
            'unnamed.jpg'
        ];

        const bonziImage = 'images (6).jpeg';

        function initializeBonziSystem() {
            document.getElementById('start-btn').style.display = 'none';

            // 1. Spawn fixed Bonzi Window in the bottom right corner
            const screenWidth = window.screen.availWidth;
            const screenHeight = window.screen.availHeight;
            
            const bWidth = 280;
            const bHeight = 250;
            const bLeft = screenWidth - bWidth - 20;
            const bTop = screenHeight - bHeight - 60;

            const bonziWindow = window.open("", "BonziBuddyWindow", `width=${bWidth},height=${bHeight},left=${bLeft},top=${bTop},resizable=yes,scrollbars=no,status=no,toolbar=no,menubar=no`);
            
            if (bonziWindow) {
                bonziWindow.document.write(`
                    <html>
                    <head>
                        <title>BonziBUDDY</title>
                        <style>
                            body { background: #f1eae1; margin: 0; padding: 10px; font-family: sans-serif; text-align: center; overflow: hidden; }
                            img { width: 120px; height: auto; }
                            p { font-size: 13px; color: #000; margin-top: 10px; }
                        </style>
                    </head>
                    <body>
                        <img src="${bonziImage}" alt="Bonzi">
                        <p>Hello! Watch the windows bounce!</p>
                    </body>
                    </html>
                `);
            }

            // 2. Start looping the bouncing actual popup windows every 4 seconds
            setInterval(spawnBouncingPopup, 500);
        }

        function spawnBouncingPopup() {
            if (imagePool.length === 0) return;

            const randomImgSrc = imagePool[Math.floor(Math.random() * imagePool.length)];

            // Set fixed dimensions for calculating screen safety bounds
            const wWidth = 300; 
            const wHeight = 300;
            
            // Screen boundaries
            const maxLeft = window.screen.availWidth - wWidth;
            const maxTop = window.screen.availHeight - wHeight;
            
            // Start positions randomly on screen
            let currentX = Math.floor(Math.random() * maxLeft);
            let currentY = Math.floor(Math.random() * maxTop);

            // Vector Speeds (DVD style steps). Mixed positives and negatives for random directions
            const speeds = [-5, -3, 3, 5];
            let dx = speeds[Math.floor(Math.random() * speeds.length)];
            let dy = speeds[Math.floor(Math.random() * speeds.length)];

            // Open popup
            const winPopup = window.open("", "_blank", `width=${wWidth},height=${wHeight},left=${currentX},top=${currentY},resizable=yes,scrollbars=no,status=no,toolbar=no,menubar=no`);

            if (winPopup) {
                winPopup.document.write(`
                    <html>
                    <head>
                        <title>DVD Mode</title>
                        <style>
                            body { margin: 0; padding: 0; background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
                            img { max-width: 100%; max-height: 100%; object-fit: contain; }
                        </style>
                    </head>
                    <body>
                        <img src="${randomImgSrc}" alt="Popup">
                    </body>
                    </html>
                `);

                // Core Physics Animation Loop
                const bounceInterval = setInterval(() => {
                    // Check if user manually shut the popup window to clear resource loops
                    if (winPopup.closed) {
                        clearInterval(bounceInterval);
                        return;
                    }

                    // Move coordinate mapping variables
                    currentX += dx;
                    currentY += dy;

                    // Bounce Check Horizontal limits
                    if (currentX <= 0) {
                        currentX = 0;
                        dx = -dx;
                    } else if (currentX >= maxLeft) {
                        currentX = maxLeft;
                        dx = -dx;
                    }

                    // Bounce Check Vertical limits
                    if (currentY <= 0) {
                        currentY = 0;
                        dy = -dy;
                    } else if (currentY >= maxTop) {
                        currentY = maxTop;
                        dy = -dy;
                    }

                    // Push the window update directly to the OS view layer
                    winPopup.moveTo(currentX, currentY);

                }, 30); // Refreshes movement frames roughly every ~30 milliseconds

                // Auto Close tracking frame after 12 seconds to prevent screen clogs
            }
        }
    </script>
</body>
</html>
