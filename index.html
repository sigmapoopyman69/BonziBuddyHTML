<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonzi Buddy World</title>
    <style>
        /* Reset and background */
        body {
            margin: 0;
            padding: 0;
            background-color: #a370cc; /* Classic Bonzi purple background */
            font-family: "MS Sans Serif", Geneva, sans-serif;
            overflow: hidden; /* Prevents scrollbars when images pop up */
            height: 100vh;
            width: 100vw;
            user-select: none; /* Prevents text highlighting while dragging */
        }

        /* Bonzi Buddy Fixed Window */
        #bonzi-window {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 250px;
            background: #f1eae1;
            border: 2px solid #000;
            box-shadow: 3px 3px 0px #808080;
            padding: 10px;
            z-index: 9999; /* Keeps Bonzi on top of everything */
            text-align: center;
        }

        /* Draggable Header Title Bar */
        .window-header {
            background: linear-gradient(to right, #000080, #1084d0);
            color: white;
            padding: 3px 6px;
            font-weight: bold;
            font-size: 12px;
            text-align: left;
            margin-bottom: 10px;
            cursor: move; /* Shows movement cursor */
        }

        #bonzi-sprite {
            width: 120px;
            height: auto;
            pointer-events: none; /* Prevents ghost-dragging the image itself */
        }

        /* Popup Image Styling */
        .popup-image {
            position: absolute;
            max-width: 200px;
            max-height: 200px;
            animation: popIn 0.3s ease-out;
            z-index: 10;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Bonzi Buddy Draggable Window -->
    <div id="bonzi-window">
        <div class="window-header" id="bonzi-header">BonziBUDDY</div>
        <img id="bonzi-sprite" src="images (6).jpeg" alt="Bonzi Buddy">
        <p id="bonzi-dialogue">Hello! I am your companion. Drag me anywhere!</p>
    </div>

    <script>
        // 1. Array of your exact uploaded image filenames
        const imagePool = [
            'IMG_3879-210x280.jpeg',
            'geometry-dash-grief.gif',
            'pasted-image-1792970376308_b50ae186-598f-44c2-8402-41e0d044af46.png',
            'unnamed.jpg'
        ];

        // 2. Drag and Drop Logic for Bonzi Window
        const bonziWindow = document.getElementById("bonzi-window");
        const bonziHeader = document.getElementById("bonzi-header");

        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        bonziHeader.addEventListener("mousedown", (e) => {
            isDragging = true;
            
            // Get initial click position
            startX = e.clientX;
            startY = e.clientY;

            // Get current positional styling of the window
            const rect = bonziWindow.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;

            // Switch layout from fixed 'bottom/right' to absolute coordinates during drag
            bonziWindow.style.bottom = "auto";
            bonziWindow.style.right = "auto";
            bonziWindow.style.left = `${initialLeft}px`;
            bonziWindow.style.top = `${initialTop}px`;
        });

        document.addEventListener("mousemove", (e) => {
            if (!isDragging) return;

            // Calculate how far the mouse has moved
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            // Move the window to the new position
            bonziWindow.style.left = `${initialLeft + dx}px`;
            bonziWindow.style.top = `${initialTop + dy}px`;
        });

        document.addEventListener("mouseup", () => {
            isDragging = false;
        });


        // 3. Function to spawn a random image
        function spawnRandomImage() {
            if (imagePool.length === 0) return;

            const img = document.createElement('img');
            const randomSrc = imagePool[Math.floor(Math.random() * imagePool.length)];
            
            img.src = randomSrc;
            img.classList.add('popup-image');

            // Calculate random coordinates inside the viewport boundaries
            const maxX = window.innerWidth - 200;
            const maxY = window.innerHeight - 200;

            const randomX = Math.max(0, Math.floor(Math.random() * maxX));
            const randomY = Math.max(0, Math.floor(Math.random() * maxY));

            img.style.left = `${randomX}px`;
            img.style.top = `${randomY}px`;

            document.body.appendChild(img);

        // Spawn a new image every 3 seconds
        setInterval(spawnRandomImage, 50);
    </script>
</body>
</html>
